<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Luckiest+Guy&family=JetBrains+Mono:wght@100;400;700&display=swap');

  body {
    margin: 0;
    height: 100vh;
    background-color: #f7f7f7;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #1a1a1a;
    transition: background-color 3s ease, color 3s ease;
  }

  #start-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: #1a1a1a;
    color: #f7f7f7;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Londrina Solid', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 2px;
    z-index: 9999;
    transition: opacity 1.5s ease;
  }

  #initiate-btn {
    cursor: pointer;
    margin-bottom: 30px;
    padding: 20px;
    border: 1px solid #f7f7f7;
    transition: color 0.3s ease, background-color 0.3s ease;
    text-transform: uppercase;
  }
  
  #initiate-btn:hover {
      color: #1a1a1a;
      background-color: #f7f7f7;
  }

  #phase-indicator {
    position: absolute;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Londrina Solid', sans-serif !important;
    font-size: 2.2rem;
    letter-spacing: 4px;
    opacity: 0.5;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    transition: color 2s ease;
  }

  #story-container {
    width: 90%;
    max-width: 1000px;
    position: relative;
    line-height: 1.5; 
    transition: letter-spacing 4s ease;
  }

  .is-digital {
    font-family: 'Londrina Solid', sans-serif;
    font-size: 2.6rem; 
    text-transform: uppercase;
    transition: font-size 0.5s ease, color 0.8s ease, background-color 1.5s ease;
  }

  .is-handwritten {
    font-family: 'Luckiest Guy', cursive;
    font-size: 2.4rem; 
    letter-spacing: 1px !important; 
    text-transform: uppercase;
    transition: font-size 0.5s ease, color 0.8s ease, background-color 1.5s ease;
  }

  .word {
    display: inline-block;
    position: relative;
    transition: color 0.8s ease, text-shadow 0.8s ease;
  }

  .diagram-node {
    position: absolute;
    bottom: calc(100% + 25px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 0.85rem;
    color: #444;
    border: 2px solid #aaa;
    background: rgba(247, 247, 247, 0.95);
    padding: 10px 14px;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
    white-space: pre-wrap; 
    letter-spacing: -0.2px;
    line-height: 1.5;
    z-index: 10;
    text-align: center;
    width: 150px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  }

  .letter-count-circle {
    position: absolute;
    bottom: calc(100% + 125px); 
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #000;
    color: #fff;
    border: 3px solid #000;
    box-sizing: border-box;
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease, background-color 0.1s ease, color 0.1s ease;
    z-index: 15;
    font-weight: 700;
  }

  .diagram-line {
    position: absolute;
    bottom: calc(100% + 5px);
    left: 50%;
    width: 2px;
    height: 20px;
    background: #aaa;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .text {
    display: inline-block;
    transition: opacity 0.8s ease, background-color 1.5s ease, color 1.5s ease;
    line-height: 1.1; 
    padding: 4px 8px; 
    margin: 0 -1px; /* Pulls elements closer so backgrounds touch perfectly */
    border-radius: 4px 8px 3px 6px / 8px 3px 6px 4px; /* Organic wavy painted edge */
    vertical-align: baseline; 
  }

  .morphed .text {
    font-weight: 900;
    letter-spacing: 1px;
  }

  .fade-out {
    opacity: 0;
  }

  .connective {
    transition: opacity 0.5s ease, color 1s ease;
    display: inline-block;
    line-height: 1.1;
    vertical-align: baseline;
    white-space: pre-wrap;
    text-transform: uppercase;
  }

  .analyzing .diagram-node,
  .analyzing .diagram-line,
  .analyzing .letter-count-circle {
    opacity: 1;
  }

  .analyzing .letter-count-circle {
    transform: translateX(-50%) scale(1);
  }

  .analyzing .diagram-node {
    color: var(--analysis-color);
    border-color: var(--analysis-color);
    z-index: 99; 
  }

  .analyzing .diagram-line {
    background: var(--analysis-color);
  }

  .analyzing .text {
    color: var(--analysis-color); 
    position: relative;
    z-index: 90;
  }
  
  .morphed.analyzing .text {
    color: inherit;
    opacity: 0.8;
  }

  .identity-shifting .diagram-node,
  .identity-shifting .diagram-line,
  .identity-shifting .letter-count-circle {
    opacity: 1;
  }

  .identity-shifting .letter-count-circle {
    transform: translateX(-50%) scale(1);
  }

  .identity-shifting .diagram-node {
    color: #e67e22; 
    border-color: #e67e22;
  }

  .identity-shifting .diagram-line {
    background: #e67e22;
  }

  .identity-shifting .text {
    color: #e67e22; 
  }
</style>
</head>

  let fontIndex = 0;
  const MAX_FONT_STEPS = 6; 
  const container = document.getElementById('story-container');

  document.getElementById('initiate-btn').addEventListener('click', async () => {
    // Play hidden silent audio to unlock browser Web Audio API properly
    const unlockAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
    unlockAudio.play().catch(e => console.log("Unlock check:", e));

    const overlay = document.getElementById('start-overlay');
    overlay.style.opacity = 0;

    setTimeout(async () => {
      overlay.remove();
      buildStory();
      
      let fullStoryString = getStoryText();
      await speakRealisticCloudVoice(fullStoryString, 0);
      
      setTimeout(() => {
         morphStory();
         startIdentityShifts(); 
      }, 1000);
    }, 1500);
  });

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function speakRealisticCloudVoice(text, phase) {
    // Robust sentence splitting to handle the mutating punctuation and new phonetic periods
    let rawParts = text.split(/([.!?]+)/);
    let sentences = [];
    for (let i = 0; i < rawParts.length; i += 2) {
        let s = rawParts[i] ? rawParts[i].trim() : "";
        let p = rawParts[i+1] || "";
        if (s || p) sentences.push((s + p).trim());
    }
    if (sentences.length === 0) sentences = [text];
    
    // Choose voice based on phase decay
    let voice = 'Joanna'; 
    if (phase >= 4 && phase <= 7) voice = 'Matthew'; 
    if (phase > 7) voice = 'Brian'; 

    // The Chorus Effect: Number of overlapping voices increases with time
    const maxVoices = Math.min(phase + 1, 7); 

    for (let i = 0; i < sentences.length; i++) {
        let sentence = sentences[i];
        if (!sentence) continue;

        const primaryUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voice}&text=${encodeURIComponent(sentence)}`;
        const backupUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-us&q=${encodeURIComponent(sentence)}`;
        
        const playPromises = [];
        
        for (let v = 0; v < maxVoices; v++) {
            playPromises.push((async () => {
                if (v > 0) {
                    await sleep(v * 600); 
                }

                const rateDrift = (v * 0.05); 
                const targetRate = Math.max(0.3, 1.0 - (phase * 0.04) + rateDrift);

                let success = await new Promise(resolve => {
                    let isResolved = false;
                    const done = (status) => {
                        if (!isResolved) {
                            isResolved = true;
                            resolve(status);
                        }
                    };

                    const audio = new Audio(primaryUrl);
                    audio.playbackRate = targetRate;
                    audio.onended = () => done(true);
                    audio.onerror = () => done(false);
                    audio.play().then(() => {
                        setTimeout(() => done(true), 15000); 
                    }).catch(() => done(false));
                });

                if (!success) {
                    await new Promise(resolve => {
                        let isResolved = false;
                        const done = () => {
                            if (!isResolved) {
                                isResolved = true;
                                resolve();
                            }
                        };
                        const gAudio = new Audio(backupUrl);
                        gAudio.playbackRate = targetRate;
                        gAudio.onended = done;
                        gAudio.onerror = done;
                        gAudio.play().catch(done);
                        setTimeout(done, 15000);
                    });
                }
            })());
        }
        
        await Promise.all(playPromises);
    }
  }

  // The chopped, glitchy local voice (Used ONLY during the Matrix flash scanning)
  async function speakChoppyGlitch(rawText) {
      return new Promise(resolve => {
        if (!window.speechSynthesis) return resolve();
        window.speechSynthesis.cancel(); 
        
        // Translate visual symbols into spoken audio for the glitch voice
        let spokenText = rawText.replace(/█+/g, 'redacted').replace(/\|/g, 'pipe').replace(/\/\/\//g, 'end line').replace(/\[ERR\]/g, 'error').replace(/_/g, 'underscore');

        let msg = new SpeechSynthesisUtterance(spokenText);
        msg.rate = 1.6; 
        msg.pitch = 1.3;
        msg.volume = 0.4; 
        
        let isResolved = false;
        const done = () => {
            if(!isResolved) {
                isResolved = true;
                resolve();
            }
        };

        msg.onend = done;
        msg.onerror = done;
        window.speechSynthesis.speak(msg);
        
        setTimeout(done, 250);
      });
  }

  function getStoryText() {
    let fullTextArray = [];
    container.childNodes.forEach(node => {
      let text = '';
      if (node.classList.contains('connective')) {
        text = node.innerText; // Capture the mutated connective tissue!
      } else if (node.classList.contains('word')) {
        text = node.querySelector('.text').innerText;
      }

      // Translate visual syntax entropy into spoken durational words
      text = text.replace(/█+/g, ' redacted. ');
      text = text.replace(/\|/g, ' pipe, ');
      text = text.replace(/\/\/\//g, ' end-line. ');
      text = text.replace(/\[ERR\]/g, ' error, ');
      text = text.replace(/_/g, ' underscore ');

      fullTextArray.push(text);
    });
    return fullTextArray.join('');
  }

  function scrambleIndicator(targetText) {
    const el = document.getElementById('phase-indicator');
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_<>|[]*+()";
    let iterations = 0;
    const interval = setInterval(() => {
      let currentString = "";
      for (let i = 0; i < targetText.length; i++) {
        if (i < iterations) {
          currentString += targetText[i];
        } else {
          currentString += chars[Math.floor(Math.random() * chars.length)];
        }
      }
      el.innerText = currentString;
      if (iterations >= targetText.length) clearInterval(interval);
      iterations += 0.6; 
    }, 40);
  }

  function getWordMetadata(word) {
    let hash = 0;
    for (let i = 0; i < word.length; i++) {
      hash = word.charCodeAt(i) + ((hash << 5) - hash);
    }
    hash = Math.abs(hash);
    const sensory = ['VISUAL', 'AUDITORY', 'KINETIC', 'ECHOING', 'FADING', 'VIVID', 'DISTANT', 'WARM'];
    const emotions = ['NOSTALGIA', 'LONGING', 'COMFORT', 'SORROW', 'AFFECTION', 'LOSS', 'REVERENCE', 'WONDER'];
    const clarity = ['CRYSTAL', 'BLURRED', 'FRAGMENTED', 'FADED', 'GLOWING', 'DISTORTED', 'SHADOWY', 'MYTHIC'];
    return {
      sensory: sensory[hash % sensory.length],
      emotion: emotions[(hash >> 2) % emotions.length],
      clarity: clarity[(hash >> 4) % clarity.length]
    };
  }

  function buildStory() {
    container.innerHTML = '';
    template.forEach(item => {
      if (typeof item === 'string') {
        const span = document.createElement('span');
        span.className = 'connective is-digital';
        span.dataset.original = item;
        span.innerText = item;
        container.appendChild(span);
      } else {
        const options = lexicon[item.key];
        const initialData = options[0]; 
        
        const wrapper = document.createElement('span');
        wrapper.className = 'word mutable';
        wrapper.dataset.key = item.key;
        wrapper.dataset.currentWord = initialData.w;
        wrapper.dataset.phase = "0";

        const node = document.createElement('div');
        node.className = 'diagram-node';
        
        const circle = document.createElement('div');
        circle.className = 'letter-count-circle';

        const line = document.createElement('div');
        line.className = 'diagram-line';
        
        const textSpan = document.createElement('span');
        textSpan.className = 'text is-digital';
        textSpan.innerText = initialData.w;

        wrapper.appendChild(node);
        wrapper.appendChild(circle);
        wrapper.appendChild(line);
        wrapper.appendChild(textSpan);
        container.appendChild(wrapper);
      }
    });
  }

  async function morphStory() {
    globalCycle++;
    const nextGlobalPhase = globalCycle % 12;
    scrambleIndicator(phaseNames[nextGlobalPhase]);

    // Incremental Font Swapping Logic
    fontIndex += fontTrend;
    if (fontIndex >= MAX_FONT_STEPS) { fontTrend = -1; fontIndex = MAX_FONT_STEPS; }
    if (fontIndex <= 0) { fontTrend = 1; fontIndex = 0; }
    
    let targetRatio = fontIndex / MAX_FONT_STEPS; 
    let textNodes = [];
    
    container.childNodes.forEach(node => {
      if (node.classList.contains('connective')) {
        textNodes.push(node);
      } else if (node.classList.contains('word')) {
        textNodes.push(node.querySelector('.text'));
      }
    });
    
    let targetHandwritten = Math.round(textNodes.length * targetRatio);
    let currentHandwritten = textNodes.filter(el => el.classList.contains('is-handwritten')).length;
    
    // Shuffle the array to randomly pick elements to infect/repair
    textNodes.sort(() => 0.5 - Math.random());
    
    if (currentHandwritten < targetHandwritten) {
      let needed = targetHandwritten - currentHandwritten;
      let digitals = textNodes.filter(el => el.classList.contains('is-digital'));
      for(let i = 0; i < needed && i < digitals.length; i++) {
        digitals[i].classList.remove('is-digital');
        digitals[i].classList.add('is-handwritten');
      }
    } else if (currentHandwritten > targetHandwritten) {
      let needed = currentHandwritten - targetHandwritten;
      let handwrittens = textNodes.filter(el => el.classList.contains('is-handwritten'));
      for(let i = 0; i < needed && i < handwrittens.length; i++) {
        handwrittens[i].classList.remove('is-handwritten');
        handwrittens[i].classList.add('is-digital');
      }
    }

    const children = container.childNodes;
    const currentPalette = cyclePalettes[globalCycle % cyclePalettes.length];
    
    // --- NEW: SYNTACTIC ENTROPY ENGINE ---
    // This breaks down the spaces, commas, and periods over time
    container.childNodes.forEach(node => {
      if (node.classList.contains('connective')) {
        let orig = node.dataset.original;
        
        // Phase 0-4: Normal grammar
        if (nextGlobalPhase < 5) {
            node.innerText = orig;
        } 
        // Phase 5-8: Punctuation begins to turn to code/math
        else if (nextGlobalPhase < 9) {
            if (orig.includes(',')) node.innerText = orig.replace(',', ' |');
            else if (orig.includes('.')) node.innerText = orig.replace('.', ' ///');
            else node.innerText = orig;
        } 
        // Phase 9-11: Total structural collapse into blocks and errors
        else {
            if (orig === ' ') node.innerText = Math.random() > 0.7 ? ' _ ' : ' ';
            else if (orig.includes(',')) node.innerText = ' [ERR] ';
            else if (orig.includes('.')) node.innerText = ' █ ';
            else node.innerText = orig;
        }
      }
    });
    
    // 1. Setup the continuous reading loop that runs WHILE mutations happen
    let isMutating = true;
    const continuousReading = async () => {
      while (isMutating) {
        let currentStoryString = getStoryText();
        await speakRealisticCloudVoice(currentStoryString, nextGlobalPhase);
        
        // Take a 1-second breath between loops, but only if we are still mutating
        if (isMutating) {
            await sleep(1000); 
        }
      }
    };
    
    // Kick it off (do not await it here, so it runs parallel to the visual loop)
    let readingLoopPromise = continuousReading();
    
    // 2. Visually mutate the words one by one
    for (let i = 0; i < children.length; i++) {
      const el = children[i];
      
      if (el.classList.contains('mutable')) {
          const key = el.dataset.key;
          const currentWord = el.dataset.currentWord;
          let phase = parseInt(el.dataset.phase);
          let nextPhase = (phase + 1) % 12; 

          const options = lexicon[key] || [];
          const node = el.querySelector('.diagram-node');
          const circle = el.querySelector('.letter-count-circle');
          const textSpan = el.querySelector('.text');

          const activeColor = analysisColors[Math.floor(Math.random() * analysisColors.length)];
          el.style.setProperty('--analysis-color', activeColor);

          el.classList.add('analyzing');
          
          const currentMeta = getWordMetadata(currentWord);
          node.innerText = `[RECALLING: ${currentWord}]\nSENSORY: ${currentMeta.sensory}\nEMOTION: ${currentMeta.emotion}\nCLARITY: ${currentMeta.clarity}`;
          await sleep(400); 

          node.innerText = `[SEARCHING MEMORY...]`;
          
          for (let p = 0; p < 2; p++) {
            let temp = options[Math.floor(Math.random() * options.length)];
            let tempMeta = getWordMetadata(temp.w);
            let tempLen = temp.w.replace(/[^a-zA-Z0-9]/g, '').length;
            
            textSpan.innerText = temp.w;
            circle.innerText = tempLen;
            circle.style.backgroundColor = (tempLen % 2 === 0) ? '#000' : '#fff';
            circle.style.color = (tempLen % 2 === 0) ? '#fff' : '#000';
            node.innerText = `[FEELING: ${temp.w}]\nSENSORY: ${tempMeta.sensory}\nEMOTION: ${tempMeta.emotion}`;
            
            // Stutter choppy robot local voice on the flashes (now with timeout safety)
            await speakChoppyGlitch(temp.w);
          }

          let targetOptions = options.filter(o => o.l === nextPhase);
          let newData = targetOptions.length > 0 ? targetOptions[Math.floor(Math.random() * targetOptions.length)] : options[0];

          const wordLength = newData.w.replace(/[^a-zA-Z0-9]/g, '').length;
          const isEven = wordLength % 2 === 0;

          circle.style.backgroundColor = isEven ? '#000' : '#fff';
          circle.style.color = isEven ? '#fff' : '#000';

          let newMeta = getWordMetadata(newData.w);
          node.innerText = `[RESONANCE: ${newData.w}]\n[LEN: ${wordLength}]\nEMOTION: ${newMeta.emotion}\nCLARITY: ${newMeta.clarity}`;
          circle.innerText = wordLength;

          textSpan.classList.add('fade-out');
          await sleep(300); 
          
          el.dataset.phase = nextPhase;
          el.classList.add('morphed');

          // --- NEW: TOTAL ABSTRACTION AT LATE STAGES ---
          let displayWord = newData.w;
          if (nextGlobalPhase >= 10 && Math.random() > 0.6) {
              // 40% chance in the final phases to turn a word into a solid blackout block
              displayWord = "██████".substring(0, Math.max(3, wordLength)); 
          }

          if (nextPhase === 0) {
            textSpan.style.color = '';
            textSpan.style.background = '';
            el.classList.remove('morphed');
          } else {
            textSpan.style.color = isEven ? currentPalette.c1 : currentPalette.c2;
            textSpan.style.background = isEven ? currentPalette.c2 : currentPalette.c1;
          }
          
          textSpan.innerText = displayWord;
          el.dataset.currentWord = displayWord; // keep track of what's displayed
          textSpan.classList.remove('fade-out');
          
          await sleep(400); 
          el.classList.remove('analyzing');
          await sleep(100); 
      }
    }

    // 3. Stop the continuous reading loop and wait for it to finish its current sentence
    isMutating = false;
    await readingLoopPromise;

    document.body.style.backgroundColor = currentPalette.c1;
    document.body.style.color = currentPalette.c2;

    // 4. Now isolate the audio and read the completely NEW, morphed story one last time
    let finalStoryString = getStoryText();
    await speakRealisticCloudVoice(finalStoryString, nextGlobalPhase);

    // 5. Schedule the next timeline shift
    setTimeout(morphStory, 4000);
  }

  function startIdentityShifts() {
    const subjectKeys = ['subject1', 'subject2', 'subject3'];
    subjectKeys.forEach(key => {
      const loop = async () => {
        const mutables = document.querySelectorAll('.mutable');
        const el = Array.from(mutables).find(m => m.dataset.key === key);
        
        if (el && !el.classList.contains('analyzing') && !el.classList.contains('identity-shifting')) {
           el.classList.add('identity-shifting');
           const node = el.querySelector('.diagram-node');
           const textSpan = el.querySelector('.text');
           const circle = el.querySelector('.letter-count-circle');
           const options = lexicon[key];
           const currentWord = el.dataset.currentWord;
           let phase = parseInt(el.dataset.phase) || 0;
           
           node.innerText = `[MEMORY BLUR]`;
           
           for(let i = 0; i < 3; i++) {
               let temp = options[Math.floor(Math.random() * options.length)];
               let tempLen = temp.w.replace(/[^a-zA-Z0-9]/g, '').length;
               circle.innerText = tempLen;
               circle.style.backgroundColor = (tempLen % 2 === 0) ? '#000' : '#fff';
               circle.style.color = (tempLen % 2 === 0) ? '#fff' : '#000';
               textSpan.innerText = temp.w;
               await speakChoppyGlitch(temp.w); 
           }
           
           let targetOptions = options.filter(o => o.l === phase);
           let pool = targetOptions.length > 0 ? targetOptions : options.filter(o => o.l === 0);
           
           let finalData;
           let attempts = 0;
           do {
               finalData = pool[Math.floor(Math.random() * pool.length)];
               attempts++;
           } while (finalData.w === currentWord && pool.length > 1 && attempts < 5);
           
           textSpan.innerText = finalData.w;
           el.dataset.currentWord = finalData.w;
           
           let wordLength = finalData.w.replace(/[^a-zA-Z0-9]/g, '').length;
           circle.innerText = wordLength;
           circle.style.backgroundColor = (wordLength % 2 === 0) ? '#000' : '#fff';
           circle.style.color = (wordLength % 2 === 0) ? '#fff' : '#000';
           node.innerText = `[SETTLED: ${finalData.w}]`;
           
           await sleep(1000);
           el.classList.remove('identity-shifting');
        }
        setTimeout(loop, Math.random() * 15000 + 10000);
      };
      setTimeout(loop, Math.random() * 10000 + 5000);
    });
  }
