const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const _last = {};
function fresh(key, arr) {
  let v = pick(arr);
  if (arr.length > 2 && v === _last[key]) v = pick(arr);
  _last[key] = v;
  return v;
}
function some(arr, n) {
  const c = arr.slice();
  const out = [];
  while (n-- > 0 && c.length) out.push(c.splice(Math.floor(Math.random() * c.length), 1)[0]);
  return out;
}

// ---- the recursion ------------------------------------------------------
function nestPhrase(depth, thing) {
  if (depth <= 0) return "for " + thing;
  let s = "";
  let mine = false;
  for (let i = 0; i < depth; i++) {
    const w = pick(NOTE);
    if (i === 0) s += "for your " + w + " thanking me ";
    else s += "for " + (mine ? "my " : "your ") + w + " thanking " + (mine ? "you " : "me ");
    mine = !mine;
  }
  return (s + "for " + thing).replace(/\s+/g, " ");
}

function ordinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function gratitude(state, force) {
  const depth = state.depth;
  const thing = (depth > 8 && chance(0.35)) ? pick(FADED) : state.thing;
  let phrase;
  if (depth <= 4 || force || chance(0.10)) {
    phrase = nestPhrase(depth, thing);
  } else {
    const mode = ri(1, 5);
    if (mode === 1) phrase = nestPhrase(ri(2, 3), "").replace(/for $/, "") + "and so on, back to " + thing;
    else if (mode === 2) phrase = "for your note, which thanked me for mine, which thanked you for yours, and so on down to " + thing;
    else if (mode === 3) phrase = "for no. " + (state.n - 1);
    else if (mode === 4) phrase = "for the " + ordinal(depth) + " of these";
    else phrase = "for yours of the " + ordinal(ri(1, 28));
  }
  return fresh("opener", OPENER) + " " + phrase + ".";
}

function grammarLine(used) {
  let i = Math.floor(Math.random() * gFRAMES.length);
  for (let t = 0; t < 8 && used && used.indexOf(i) >= 0; t++) i = Math.floor(Math.random() * gFRAMES.length);
  if (used) used.push(i);
  const s = gFRAMES[i]();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// a given letter is written either with contractions or without
const CONTRACT = [[/\bI have\b/g, "I've"], [/\bI am\b/g, "I'm"], [/\bdo not\b/g, "don't"],
                  [/\bdid not\b/g, "didn't"], [/\bcannot\b/g, "can't"], [/\bwill not\b/g, "won't"],
                  [/\bis not\b/g, "isn't"], [/\bhave not\b/g, "haven't"], [/\bit is\b/g, "it's"],
                  [/\bwould not\b/g, "wouldn't"], [/\bthat is\b/g, "that's"]];

function contract(text, degree) {
  if (degree <= 0) return text;
  let out = text;
  CONTRACT.forEach(function (c) {
    if (chance(degree)) out = out.replace(c[0], function (m) { return chance(0.72) ? c[1] : m; });
  });
  return out;
}

function glyphPath(ch, x, y, sc, jit) {
  const g = G[ch] || G[ch.toLowerCase()];
  if (!g) return { d: "", w: 7 * sc };
  const J = () => (Math.random() - 0.5) * jit;
  const X = p => x + p * sc + J();
  const Y = p => y + p * sc + J();
  let d = "", px = 0, py = 0;
  for (const s of g[1]) {
    if (s[0] === "m") { px = X(s[1]); py = Y(s[2]); d += " M" + px.toFixed(1) + "," + py.toFixed(1); }
    else if (s[0] === "l") {
      const nx = X(s[1]), ny = Y(s[2]);
      const bow = (Math.random() - 0.5) * sc * 1.1;         // no hand draws a straight line
      const mx = (px + nx) / 2 - (ny - py) * 0.05 + bow, my = (py + ny) / 2 + (nx - px) * 0.05 + bow;
      d += " Q" + mx.toFixed(1) + "," + my.toFixed(1) + " " + nx.toFixed(1) + "," + ny.toFixed(1);
      px = nx; py = ny;
    } else {
      const nx = X(s[5]), ny = Y(s[6]);
      d += " C" + X(s[1]).toFixed(1) + "," + Y(s[2]).toFixed(1) + " " + X(s[3]).toFixed(1) + "," + Y(s[4]).toFixed(1) + " " + nx.toFixed(1) + "," + ny.toFixed(1);
      px = nx; py = ny;
    }
  }
  return { d: d.trim(), w: g[0] * sc };
}

function wordPath(word, x, y, sc, jit) {
  let d = "", cx = x;
  for (const ch of word) {
    const g = glyphPath(ch, cx, y + (Math.random() - 0.5) * sc * 0.7, sc, jit);
    if (g.d) d += " " + g.d;
    cx += g.w + sc * 0.9;
  }
  return { d: d.trim(), w: cx - x };
}

function measureWord(w, sc) {
  let t = 0;
  for (const ch of w) { const g = G[ch] || G[ch.toLowerCase()]; t += (g ? g[0] : 7) * sc + sc * 0.9; }
  return t;
}

const FALSE_STARTS = ["thank", "the", "I", "and", "for", "you", "yours", "note", "again", "so"];

function layoutHand(text, width, sc, jit, slant) {
  function glyphTokens(word, x0, y, s, out) {          // one token per letter, drawn in order
    let cx = x0, first = out.length;
    for (const ch of word) {
      const g = glyphPath(ch, cx, y + (Math.random() - 0.5) * s * 0.7, s, jit);
      if (g.d) out.push({ d: g.d, weight: 1, y: y });
      cx += g.w + s * 0.9;
    }
    if (out.length > first) out[out.length - 1].wordEnd = true;
    return cx - x0;
  }
  const comp = -Math.tan((slant || 0) * Math.PI / 180);      // cancels the drift the skew introduces
  const tokens = [];
  const space = sc * 5.2;
  const lines = text.split("\n");
  let row = 0, x = 0;
  const slope = (Math.random() - 0.5) * 0.012;               // the writing climbs or sags

  function base() { return (row + 1) * LH - 7 + x * slope; }
  function off(y) { return y * comp; }

  for (let li = 0; li < lines.length; li++) {
    const words = lines[li].split(" ").filter(function (w) { return w.length; });
    if (!words.length) { row++; continue; }
    x = 0;
    const rowStart = row;
    for (let wi = 0; wi < words.length; wi++) {
      const word = words[wi];
      let s = sc * (0.96 + Math.random() * 0.09);
      let w = measureWord(word, s);

      if (x + w > width && x > 0) {                          // wrap, sometimes cramping the last word in
        if (w < width * 0.22 && x + w * 0.86 <= width && chance(0.35)) s *= 0.86;
        else { row++; x = 0; }
        w = measureWord(word, s);
      }

      if (chance(0.028) && word.length > 2) {                // starts the wrong word, strikes it
        const bad = chance(0.5) ? word.slice(0, 2 + Math.floor(Math.random() * 2)) : pick(FALSE_STARTS);
        const bw = measureWord(bad, s);
        if (x + bw + w + space < width) {
          const y = base(), o = off(y), xo = x + o;
          glyphTokens(bad, xo, y, s, tokens);
          let sd = "M" + (xo - 1).toFixed(1) + "," + (y - 4.5 + (Math.random() - .5) * 2).toFixed(1);
          sd += " Q" + (xo + bw / 2).toFixed(1) + "," + (y - 6 - Math.random() * 3).toFixed(1) +
                " " + (xo + bw + 1).toFixed(1) + "," + (y - 3.5 - Math.random() * 2).toFixed(1);
          if (chance(0.45)) sd += " M" + (xo + bw).toFixed(1) + "," + (y - 6).toFixed(1) +
                " Q" + (xo + bw / 2).toFixed(1) + "," + (y - 3).toFixed(1) + " " + (xo - 1).toFixed(1) + "," + (y - 5).toFixed(1);
          tokens.push({ d: sd, weight: 0.9, quick: true });
          x += bw + space * 0.7;
        }
      }

      const y = base(), xo = x + off(y);
      if (chance(0.018) && wi > 0) {                         // forgot it, squeezes it in above
        const ss = s * 0.72;
        glyphTokens(word, xo, y - LH * 0.52, ss, tokens);
        tokens.push({ d: "M" + (xo + 2).toFixed(1) + "," + (y + 1).toFixed(1) +
          " L" + (xo + 5).toFixed(1) + "," + (y - 4).toFixed(1) + " L" + (xo + 8).toFixed(1) + "," + (y + 1).toFixed(1), weight: 0.8, quick: true });
        x += measureWord(word, ss) * 0.5 + space;
        continue;
      }

      glyphTokens(word, xo, y, s, tokens);
      x += w + space;
    }

    if (chance(0.014) && row === rowStart) {                 // strikes the whole line out
      const y = base(), o = off(y);
      tokens.push({ d: "M" + (2 + o).toFixed(1) + "," + (y - 5).toFixed(1) + " Q" + (x / 2 + o).toFixed(1) + "," + (y - 7 - Math.random() * 3).toFixed(1) +
        " " + (x + o).toFixed(1) + "," + (y - 4).toFixed(1), weight: 1, quick: true });
    }
    row++;
  }
  return { tokens: tokens, height: (row + 1) * LH };
}

let writeTimer = null;

function startWriting(L, inner) {
  const NS = "http://www.w3.org/2000/svg";
  const width = Math.max(200, inner.clientWidth || 520);
  const sc = (LH / 31) * (0.94 + Math.random() * 0.16);
  const jit = 0.5 + Math.random() * 0.7;
  const weight = 1.2 + Math.random() * 0.8;
  const slant = -2 - Math.random() * 8;
  const speed = 0.65 + Math.random() * 0.9;

  const lay = layoutHand(target, width - 6, sc, jit, slant);
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + width + " " + lay.height);
  svg.setAttribute("width", width);
  svg.setAttribute("height", lay.height);
  svg.style.display = "block";
  svg.style.overflow = "visible";
  penSvg = svg;
  const g = document.createElementNS(NS, "g");
  g.setAttribute("transform", "skewX(" + slant.toFixed(1) + ")");
  g.setAttribute("fill", "none");
  g.setAttribute("stroke", "currentColor");
  g.setAttribute("stroke-linecap", "round");
  g.setAttribute("stroke-linejoin", "round");
  svg.appendChild(g);
  inner.appendChild(svg);

  let i = 0;
  (function nextToken() {
    if (i >= lay.tokens.length) {
      archive.push({ num: currentNum, text: target });
      if (archive.length > 2000) archive.shift();
      updateBtn();
      signLetter();
      let wait = ri(5000, 10000);                     // sits finished, to be read
      if (chance(0.12)) wait = ri(12000, 20000);
      writeTimer = setTimeout(startLetter, wait);
      return;
    }
    const t = lay.tokens[i++];
    if (t.y) penY = t.y;
    if (!t.d) { nextToken(); return; }
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", t.d);
    path.setAttribute("stroke-width", (weight * t.weight).toFixed(2));
    g.appendChild(path);

    const len = path.getTotalLength ? path.getTotalLength() : 120;
    const dur = Math.max(42, Math.min(460, len * 2.6 * speed)) * (t.quick ? 0.45 : 1);
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    requestAnimationFrame(function () {
      path.style.transition = "stroke-dashoffset " + (dur / 1000).toFixed(2) + "s linear";
      path.style.strokeDashoffset = 0;
    });
    follow();

    let gap = (t.wordEnd ? ri(45, 150) : ri(5, 26)) * speed;   // between letters, then between words
    if (t.wordEnd && chance(0.10)) gap += ri(250, 1300) * speed;   // pauses to think
    if (t.wordEnd && chance(0.02)) gap += ri(2500, 9000);          // puts the pen down
    writeTimer = setTimeout(nextToken, dur + gap);
  })();
}

const SIG_HANDS = [
  { name:"loopy",   sc:1.06, slant:-10, w:2.5, loop:1.28, tail:1.4, jit:2.6, lift:0.10 },
  { name:"tight",   sc:0.80, slant:-17, w:2.0, loop:0.72, tail:0.5, jit:1.7, lift:0.15 },
  { name:"upright", sc:0.96, slant:-2,  w:2.2, loop:0.92, tail:0.7, jit:2.1, lift:0.45 },
  { name:"quick",   sc:1.02, slant:-19, w:1.7, loop:1.05, tail:2.1, jit:3.5, lift:0.05 },
  { name:"heavy",   sc:1.12, slant:-7,  w:3.3, loop:1.00, tail:0.9, jit:1.9, lift:0.20 },
  { name:"spidery", sc:0.90, slant:-13, w:1.4, loop:1.15, tail:1.6, jit:3.0, lift:0.30 }
];

function signature() {
  const NS = "http://www.w3.org/2000/svg";
  const S = pick(SIG_HANDS);
  const sc = S.sc * (0.9 + Math.random() * 0.24);
  const L = S.loop * (0.9 + Math.random() * 0.25);
  const drift = (Math.random() - 0.5) * 7;                 // the line climbs or sags

  const wrap = document.createElement('div');
  wrap.className = 'sig';
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 250 88");
  wrap.appendChild(svg);

  let x = 12, y = 58, d = "";
  const j = function () { return (Math.random() - 0.5) * S.jit; };
  const P = function (p) { return (x + p[0] * sc + j()).toFixed(1) + "," + (y + p[1] * sc + j()).toFixed(1); };
  const curve = function (pts) {
    for (let i = 0; i < pts.length; i += 3) d += " C" + pts.slice(i, i + 3).map(P).join(" ");
  };
  const start = function (p) { d += " M" + P(p); };
  const lift = function () { return chance(S.lift); };

  // --- J ---
  const jv = Math.random();
  start([0, -30 * L]);
  if (jv < 0.5) {                                           // full descender loop
    curve([[5,-42*L],[30,-46*L],[32,-27*L]]);
    curve([[34,-10*L],[19,15*L],[12,25*L]]);
    curve([[4,36*L],[-11,33*L],[-9,20*L]]);
    curve([[-7,9*L],[11,2],[23,-6]]);
    x += 30 * L;
  } else {                                                  // a hook, no loop
    curve([[6,-40*L],[28,-44*L],[27,-24*L]]);
    curve([[26,-8*L],[17,10*L],[8,14*L]]);
    curve([[2,17*L],[-4,10*L],[0,2]]);
    x += 26 * L;
    if (lift()) start([6, -20]); else curve([[6,-6],[12,-14],[18,-18]]);
  }
  y += drift * 0.25;

  // --- o ---
  if (chance(0.62)) {                                       // closed
    curve([[8,-15],[27,-13],[23,-2]]);
    curve([[19,9],[3,9],[3,-3]]);
    curve([[3,-14],[19,-16],[31,-11]]);
  } else {                                                  // pinched, barely a loop
    curve([[7,-17],[20,-16],[19,-6]]);
    curve([[18,3],[8,4],[8,-4]]);
    curve([[10,-12],[22,-13],[30,-9]]);
  }
  x += 29;
  y += drift * 0.25;

  // --- h ---
  if (lift()) start([2, -2]);
  if (chance(0.6)) {                                        // looped ascender
    curve([[10,-11],[12,-42*L],[14,-54*L]]);
    curve([[16,-64*L],[23,-59*L],[20,-44*L]]);
    curve([[18,-29*L],[10,-12],[10,-2]]);
  } else {                                                  // straight stem
    curve([[4,-18],[7,-40*L],[9,-56*L]]);
    curve([[10,-38*L],[10,-14],[10,-2]]);
  }
  curve([[10,-11],[19,-17],[25,-11]]);
  curve([[29,-7],[27,-4],[27,0]]);
  x += 33;
  y += drift * 0.25;

  // --- n ---
  if (lift()) start([2, -2]);
  curve([[6,-9],[13,-17],[19,-11]]);
  curve([[23,-7],[21,-3],[21,0]]);
  if (chance(0.75)) {
    curve([[25,-11],[33,-17],[39,-11]]);
    curve([[43,-7],[41,-3],[41,0]]);
    x += 43;
  } else {                                                  // the last arch collapses
    curve([[26,-9],[34,-12],[40,-6]]);
    x += 42;
  }

  // --- the tail ---
  curve([[9 + Math.random() * 9, -5 - Math.random() * 9],
         [30 + Math.random() * 46 * S.tail, -2 + j() * 2],
         [46 + Math.random() * 62 * S.tail, 1 + (Math.random() - 0.5) * 9]]);

  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", d.trim());
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", (S.w * (0.85 + Math.random() * 0.35)).toFixed(1));
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  path.setAttribute("transform", "skewX(" + (S.slant + (Math.random() - 0.5) * 6).toFixed(1) + ")");
  svg.appendChild(path);

  if (chance(0.18)) {                                       // an underline, sometimes
    const u = document.createElementNS(NS, "path");
    const uy = 70 + Math.random() * 6;
    u.setAttribute("d", "M" + (10 + Math.random() * 8).toFixed(1) + "," + uy.toFixed(1) +
      " C" + (60 + j()) + "," + (uy + 3 + j()) + " " + (110 + j()) + "," + (uy - 4 + j()) + " " + (150 + Math.random() * 50).toFixed(1) + "," + (uy - 1).toFixed(1));
    u.setAttribute("fill", "none");
    u.setAttribute("stroke", "currentColor");
    u.setAttribute("stroke-width", (S.w * 0.7).toFixed(1));
    u.setAttribute("stroke-linecap", "round");
    svg.appendChild(u);
  }

  return { node: wrap, path: path };
}

function signLetter() {
  if (!curWrap) return;
  const sig = signature();
  curWrap.appendChild(sig.node);
  const len = sig.path.getTotalLength ? sig.path.getTotalLength() : 900;
  sig.path.style.strokeDasharray = len;
  sig.path.style.strokeDashoffset = len;
  requestAnimationFrame(function () {
    sig.path.style.transition = "stroke-dashoffset 1.3s cubic-bezier(.4,.1,.3,1)";
    sig.path.style.strokeDashoffset = 0;
  });
}

const TINT = {                        // a faint wash on the paper, by tone
  mundane:    [ 42, 26], warm:      [ 45, 62], tender:    [342, 52],
  elated:     [ 50, 78], wistful:   [256, 40], strained:  [ 96, 40],
  paranoid:   [168, 38], insistent: [216, 48], apologetic:[ 20, 56]
};
let prevTint = "hsl(45,20%,97%)";

function tintFor(mood, p) {
  const t = TINT[mood] || TINT.mundane;
  const sat = t[1] * (1.05 + p * 0.75);
  const light = 94.2 - p * 5.0;
  return "hsl(" + t[0] + "," + sat.toFixed(0) + "%," + light.toFixed(1) + "%)";
}

function paperBackground(wrap, mood, p) {             // each sheet runs from the last one's colour into its own
  const cur = tintFor(mood, p);
  const rules = "repeating-linear-gradient(to bottom, rgba(122,172,216,0) 0, rgba(122,172,216,0) " +
    (LH - 1).toFixed(2) + "px, rgba(122,172,216,.6) " + (LH - 1).toFixed(2) + "px, rgba(122,172,216,.6) " + LH.toFixed(2) + "px)";
  wrap.style.backgroundImage = rules + ", linear-gradient(to bottom, " + prevTint + ", " + cur + ")";
  wrap.style.backgroundOrigin = "content-box, padding-box";
  wrap.style.backgroundClip = "content-box, border-box";
  wrap.style.backgroundSize = "100% " + LH.toFixed(2) + "px, 100% 100%";
  wrap.style.backgroundRepeat = "repeat, no-repeat";
  prevTint = cur;
}

function pageEdge(bottom) {
  const W = Math.max(240, Math.round(stream.clientWidth || 640));
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "edge " + (bottom ? "edge-b" : "edge-t"));
  svg.setAttribute("viewBox", "0 0 " + W + " 16");
  svg.setAttribute("preserveAspectRatio", "none");

  function line(d, w, col) {
    const e = document.createElementNS(NS, "path");
    e.setAttribute("d", d);
    e.setAttribute("fill", "none");
    e.setAttribute("stroke", col || "#d0d0d0");
    e.setAttribute("stroke-width", w || 1);
    e.setAttribute("stroke-linejoin", "round");
    e.setAttribute("stroke-linecap", "round");
    e.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(e);
  }

  let d = "M0,8";
  let x = 0;
  while (x < W) {
    x = Math.min(W, x + 3 + Math.random() * 12);
    let y = 8 + (Math.random() - 0.5) * 2.8;
    if (chance(0.05)) y += (chance(0.5) ? 1 : -1) * (2 + Math.random() * 4);      // it tore deeper here
    if (chance(0.02)) {                                                           // a flap of paper
      d += " L" + x.toFixed(1) + "," + (y - 3 - Math.random() * 3).toFixed(1);
      x += 4 + Math.random() * 8;
      y = 8 + (Math.random() - 0.5) * 2;
    }
    d += " L" + Math.min(x, W).toFixed(1) + "," + y.toFixed(1);
  }
  line(d, 1.1);

  for (let i = 0; i < ri(1, 4); i++) {                                            // loose fibres
    const nx = Math.random() * W;
    line("M" + nx.toFixed(1) + ",8 l" + ((Math.random() - 0.5) * 2.5).toFixed(1) + "," + (2 + Math.random() * 4).toFixed(1), 1, "#dcdcdc");
  }
  return svg;
}

function startLetter() {
  const L = nextLetter();
  setInk(L.mood, L.num);

  const wrap = document.createElement('div');
  wrap.className = 'letter';
  const ink = inkNow();
  wrap.style.color = ink;
  wrap.style.setProperty("--ink", ink);
  paperBackground(wrap, L.mood, state.lucid ? state.pressure * 0.4 : state.pressure);

  wrap.appendChild(pageEdge(false));
  wrap.appendChild(pageEdge(true));

  const inner = document.createElement('div');
  const num = document.createElement('div');
  num.className = 'num';
  num.textContent = String(L.num);
  const body = document.createElement('span');
  inner.appendChild(num);
  inner.appendChild(body);
  wrap.appendChild(inner);
  stream.appendChild(wrap);
  curWrap = wrap;

  while (stream.children.length > KEEP) stream.removeChild(stream.firstChild);

  if (caret) caret.remove();
  caret = document.createElement('span');
  caret.className = 'caret';
  inner.appendChild(caret);

  penSvg = null; penY = 0;
  userHeld = false;

  el = body; target = L.text; pos = 0; buf = "";
  currentNum = L.num;

  selA = selB = -1; mode = "typing";
  paceBias = L.pace || 1;
  tempo = paceBias * (0.85 + Math.random() * 0.5);
  pickHand();
  burstLeft = 0; spur = 0; wrongAt = -1; lateLeft = 0; stallNext = 0;

  fastMask = new Uint8Array(target.length);             // the long runs are typed as a chant
  const re = /(thank you|thanks)[,.]?\s+((thank you|thanks)[,.]?\s*){2,}/gi;
  let m;
  while ((m = re.exec(target)) !== null) {
    for (let i = m.index; i < m.index + m[0].length && i < fastMask.length; i++) fastMask[i] = 1;
  }

  render();

  const handwritten = (L.num % 2 === 0);
  if (handwritten && caret) { caret.remove(); caret = null; }

  afterScroll = function () {                         // the blank sheet is in view before he starts
    setTimeout(function () {
      if (handwritten) startWriting(L, inner);
      else setTimeout(step, ri(200, 600));
    }, ri(500, 1200));
  };
  scrollTarget = pageTarget(wrap);
  setTimeout(function () { if (afterScroll) fireAfterScroll(); }, 4000);   // in case it never moves
}

const KEYS = { a:'s', e:'r', i:'o', o:'i', n:'m', t:'r', s:'a', r:'t', h:'j', l:'k', u:'y', d:'f', c:'v', m:'n' };

// ---- a different hand every letter --------------------------------------
const HANDS = [
  { name:"quick",     base:[9, 24],  burst:.60, punct:.45, think:.004, typo:.014, back:.014, sel:.006, stall:.010, drift:.11 },
  { name:"plodding",  base:[46, 98], burst:.04, punct:1.7, think:.030, typo:.003, back:.026, sel:.016, stall:.045, drift:.07 },
  { name:"stopstart", base:[18, 58], burst:.36, punct:1.2, think:.060, typo:.010, back:.048, sel:.030, stall:.085, drift:.20 },
  { name:"metronome", base:[33, 40], burst:.00, punct:.12, think:.002, typo:.002, back:.004, sel:.003, stall:.004, drift:.02 },
  { name:"careful",   base:[28, 68], burst:.14, punct:1.4, think:.022, typo:.003, back:.060, sel:.055, stall:.028, drift:.10 },
  { name:"hammering", base:[14, 30], burst:.30, punct:.25, think:.003, typo:.008, back:.006, sel:.004, stall:.006, drift:.05 }
];
let hand = HANDS[4], rampA = 1, rampB = 1;
let burstLeft = 0, spur = 0, wrongAt = -1, lateLeft = 0;

function pickHand() {
  let h = pick(HANDS);
  if (h.name === hand.name) h = pick(HANDS);
  hand = h;
  rampA = 0.7 + Math.random() * 0.7;          // and it speeds up or slows down
  rampB = 0.7 + Math.random() * 0.7;
}

function rampNow() { return rampA + (rampB - rampA) * (target.length ? pos / target.length : 0); }

function driftTempo() {
  tempo += (Math.random() - 0.5) * hand.drift;
  tempo += (paceBias - tempo) * 0.03;
  if (chance(0.005)) tempo = paceBias * (1.8 + Math.random() * 1.5);
  if (chance(0.004)) tempo = paceBias * 0.6;
  tempo = Math.max(0.4, Math.min(3.4, tempo));
}

function wordAhead() {
  let i = pos + 1, k = 0;
  while (i < target.length && target[i] !== ' ' && target[i] !== '\n') { i++; k++; }
  return k;
}

let stallNext = 0;

function delay(ch) {
  if (fastMask[pos]) return ri(9, 26) * Math.min(tempo, 1.2) + (ch === '\n' ? 90 : 0);
  const f = tempo * rampNow();
  let d = ri(hand.base[0], hand.base[1]) * f;
  if (burstLeft > 0) { burstLeft--; d *= 0.38; }
  if (ch === ',') d += 190 * hand.punct * f;
  if (ch === '.') d += 400 * hand.punct * f;
  if (ch === '\n') d += 300 * hand.punct * f;
  if (chance(hand.think)) d += ri(600, 2800);
  if (stallNext) { d += stallNext; stallNext = 0; }
  return d;
}

function lineStart() { return buf.lastIndexOf('\n') + 1; }

function wordsBack(k) {
  let i = buf.length, seen = 0;
  while (i > lineStart()) {
    i--;
    if (buf[i] === ' ' && i + 1 < buf.length) {
      seen++;
      if (seen >= k) return i + 1;
    }
  }
  return lineStart();
}

function startBackspace() {
  const a = wordsBack(ri(1, 4));
  if (a <= lineStart() + 2) { mode = "typing"; setTimeout(step, 40); return; }
  delStop = a;
  mode = "deleting";
  setTimeout(step, ri(160, 520));
}

function startSelect() {
  const a = wordsBack(ri(2, 6));
  if (a <= lineStart() + 2) { mode = "typing"; setTimeout(step, 40); return; }
  selA = a; selB = buf.length;
  mode = "selecting";
  render();
  setTimeout(function () {
    if (chance(0.35)) {
      selA = selB = -1; render();
      mode = "typing";
      setTimeout(step, ri(200, 700));
    } else {
      pos -= (selB - selA);
      buf = buf.slice(0, selA);
      selA = selB = -1; render(); follow();
      mode = "typing";
      setTimeout(step, ri(260, 900));
    }
  }, ri(420, 1400));
}

function step() {
  if (mode === "deleting") {
    if (buf.length > delStop) {
      const idx = buf.length - 1;
      buf = buf.slice(0, -1);
      if (spur && idx === wrongAt) { spur = 0; wrongAt = -1; } else pos--;
      render(); follow();
      setTimeout(step, ri(16, 44) * Math.min(tempo, 1.6));
    } else {
      mode = "typing";
      setTimeout(step, ri(240, 900));
    }
    return;
  }
  if (mode !== "typing") return;

  if (pos >= target.length) {
    archive.push({ num: currentNum, text: target });
    if (archive.length > 2000) archive.shift();
    updateBtn();
    signLetter();
    let wait = ri(5000, 10000);                       // sits finished, to be read
    if (chance(0.12)) wait = ri(12000, 20000);
    setTimeout(startLetter, wait);
    return;
  }

  driftTempo();
  const ch = target[pos];

  if (ch === ' ' && buf.length > 30 && !fastMask[pos] && !spur) {
    const r = Math.random();
    if (r < hand.back) { startBackspace(); return; }
    if (r < hand.back + hand.sel) { startSelect(); return; }
    if (chance(hand.stall)) stallNext = ri(2500, 11000);      // gets up, comes back
    else if (chance(hand.burst)) burstLeft = wordAhead();     // fires off a whole word
  }

  if (!spur && chance(hand.typo) && KEYS[ch]) {
    wrongAt = buf.length;
    buf += KEYS[ch];
    spur = 1;
    lateLeft = chance(0.45) ? ri(2, 9) : 0;                   // notices now, or later
    render(); follow();
    if (lateLeft === 0) {
      delStop = wrongAt;
      mode = "deleting";
      setTimeout(step, ri(200, 700));
    } else {
      setTimeout(step, delay(ch));
    }
    return;
  }

  buf += ch; pos++;
  render(); follow();

  if (spur && lateLeft > 0 && --lateLeft === 0) {
    delStop = wrongAt;
    mode = "deleting";
    setTimeout(step, ri(280, 900));
    return;
  }

  setTimeout(step, delay(ch));
}

// ---- the whole string, saved out as a pdf -------------------------------
const archive = [];
const saveBtn = document.getElementById('save');

function updateBtn() {
  saveBtn.textContent = "save pdf (" + (archive.length + (buf.length ? 1 : 0)) + ")";
}

function wrapLines(text, width) {
  const out = [];
  text.split("\n").forEach(function (para) {
    if (!para.length) { out.push(""); return; }
    let line = "";
    para.split(" ").forEach(function (w) {
      if (!line.length) line = w;
      else if ((line + " " + w).length <= width) line += " " + w;
      else { out.push(line); line = w; }
    });
    out.push(line);
  });
  return out;
}

function pdfEscape(t) { return t.replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)"); }

function buildPDF(letters) {
  const SIZE = 10.5, LEAD = 15, LEFT = 72, TOP = 720, BOTTOM = 76;
  const perPage = Math.floor((TOP - BOTTOM) / LEAD);
  const lines = [];
  letters.forEach(function (L, i) {
    lines.push(String(L.num), "");
    wrapLines(L.text, 72).forEach(function (l) { lines.push(l); });
    if (i < letters.length - 1) lines.push("", "", "");
  });

  const pages = [];
  for (let i = 0; i < lines.length; i += perPage) pages.push(lines.slice(i, i + perPage));
  if (!pages.length) pages.push([""]);

  const objs = [];
  const kids = [];
  const firstPageObj = 4;
  pages.forEach(function (_, i) { kids.push((firstPageObj + i * 2) + " 0 R"); });

  objs.push("<</Type/Catalog/Pages 2 0 R>>");
  objs.push("<</Type/Pages/Kids[" + kids.join(" ") + "]/Count " + pages.length + ">>");
  objs.push("<</Type/Font/Subtype/Type1/BaseFont/Courier/Encoding/WinAnsiEncoding>>");

  pages.forEach(function (pg, i) {
    const contentNum = firstPageObj + i * 2 + 1;
    objs.push("<</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]/Resources<</Font<</F1 3 0 R>>>>/Contents " + contentNum + " 0 R>>");
    let stream = "BT /F1 " + SIZE + " Tf " + LEAD + " TL " + LEFT + " " + TOP + " Td\n";
    pg.forEach(function (l) { stream += "(" + pdfEscape(l) + ") Tj T*\n"; });
    stream += "ET";
    objs.push("<</Length " + stream.length + ">>\nstream\n" + stream + "\nendstream");
  });

  let pdf = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach(function (o, i) {
    offsets.push(pdf.length);
    pdf += (i + 1) + " 0 obj\n" + o + "\nendobj\n";
  });
  const xref = pdf.length;
  pdf += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
  offsets.forEach(function (off) { pdf += ("0000000000" + off).slice(-10) + " 00000 n \n"; });
  pdf += "trailer\n<</Size " + (objs.length + 1) + "/Root 1 0 R>>\nstartxref\n" + xref + "\n%%EOF";

  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
  return new Blob([bytes], { type: "application/pdf" });
}

saveBtn.addEventListener('click', function () {
  const all = archive.slice();
  if (buf.length) all.push({ num: currentNum, text: buf });
  const blob = buildPDF(all);
  const name = "thank-you-" + all.length + ".pdf";

  function localSave() {                               // opened as a file on disk
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 4000);
  }

  if (window.claude && window.claude.use) {            // opened as a published page
    Promise.resolve(window.claude.use("downloads")).then(function (dl) {
      if (dl && dl.save) dl.save({ filename: name, data: blob }).catch(function () { });
      else localSave();
    }).catch(localSave);
  } else localSave();
});

startLetter();
</script>
</body>
</html>
